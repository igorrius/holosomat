name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # main, PR і тег: формат, clippy, тести. Exe тут не збираємо.
  check:
    name: Перевірки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # Лише тег v* (наприклад, v0.2.0): збірка exe і GitHub Release з zip.
  release:
    name: Windows exe → Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/holosomat.exe dist/Holosomat.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath Holosomat-windows-x64.zip -Force

      # Якщо реліз уже створено вручну (через UI), zip довантажується до нього.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Holosomat-windows-x64.zip --clobber
          } else {
            gh release create $tag Holosomat-windows-x64.zip --title "Голосомат $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
